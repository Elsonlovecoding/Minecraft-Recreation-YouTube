<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Browser Minecraft</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #lock-hint {
      position: fixed;
      z-index: 20; /* above the HUD layer */
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      background: rgba(0, 0, 0, 0.55);
      font: 16px/1.5 monospace;
      padding: 12px 18px;
      border-radius: 4px;
      pointer-events: none;
      text-align: center;
      user-select: none;
    }
    #lock-hint.hidden {
      display: none;
    }
    /* Paused (Esc mid-game): the hint gains a title. Everything is frozen
       by main.js; this is just the label. */
    body.mc-paused #lock-hint::before {
      content: "Game paused";
      display: block;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 8px;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="lock-hint">Click to play<br>WASD move &middot; Space jump &middot; Shift sneak<br>double-tap W (or Ctrl) sprint &middot; F4 fly<br>E inventory &middot; 1-9 / scroll select &middot; mouse dig / place</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
